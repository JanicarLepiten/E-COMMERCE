<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petshop - Home</title>
  <link rel="stylesheet" href="design.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="code.js"></script>
  <script src="mystocks.js"></script>

</head>

<body>
  <div class="topbar">
    <div class="nav-left">
      <img src="petshop_logo.png" alt="Petshop Logo" class="logo">
      <div class="nav-links">
        <a href="contents.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
      </div>
    </div>

    <!-- 🧾 Cart Flyout Panel -->
    <div id="cart-flyout" class="cart-flyout">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-btn" onclick="toggleCartFlyout()">✖</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <p><strong>Total:</strong> ₱<span id="cart-total">0.00</span></p>
        <button class="checkout-btn">Checkout</button>
      </div>
    </div>

    <!-- 🧾 Checkout Flyout (Centered Modal) -->
    <div id="checkout-flyout" class="checkout-flyout centered">
      <div class="checkout-header">
        <h2>Order Summary</h2>
        <button class="close-btn" onclick="toggleCheckoutFlyout()">✖</button>
      </div>

      <div id="checkout-items" class="checkout-items"></div>

      <div class="checkout-summary">
        <p><strong>Products Total:</strong> ₱<span id="checkout-products-total">0.00</span></p>
        <p><strong>Shipping Fee:</strong> ₱70.00</p>
        <hr>
        <p><strong>Overall Total:</strong> ₱<span id="checkout-overall-total">0.00</span></p>
        <button class="order-now-btn" onclick="orderNow()">Order Now</button>
      </div>
    </div>

    <!-- Topbar section -->
    <div class="account-section">
      <a href="account.html" class="account-btn">My Account</a>
      <div class="cart" onclick="toggleCartFlyout()">
        <img src="cart.png" alt="Cart" class="cart-icon">
        <span id="cartCount" class="cart-badge">0</span>
      </div>
    </div>
  </div>

  <div class="home-content">
    <h1>Welcome to Purrfect Petshop</h1>
    <p>Your one-stop shop for all your pet’s needs!</p>

    <!-- 🖼 Slideshow container -->
    <div class="slideshow">
      <img src="pethome1.jpg" class="slide active">
      <img src="pethome2.jpg" class="slide">
      <img src="pethome3.jpg" class="slide">
      <img src="pethome4.jpg" class="slide">

      <button class="next-btn" onclick="nextSlide()">&#8250;</button>
    </div>
  </div>

  <!-- View Products Button -->
<div class="view-products">
  <a href="products.html" class="view-btn">VIEW PRODUCTS</a>
</div>
</body>

</html>
